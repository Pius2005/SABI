# Render blueprint for the SABI API.
#
# The API is a long-running Node process that keeps its database in a single
# JSON file, so it needs a persistent disk — not a serverless filesystem.
# The frontend is deployed separately (Vercel); this service builds it too and
# serves apps/web/dist as a single-origin fallback.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked `sync: false` are prompted for on the first deploy.

services:
  - type: web
    name: sabi-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    # Dev dependencies are required: Vite and TypeScript build the PWA. The API
    # itself runs through tsx, which is a runtime dependency.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Absolute path on the mounted disk below.
      - key: DATABASE_FILE
        value: /var/data/sabi.json
      # Generated once and kept by Render. Production refuses to start without
      # 32+ character values for all three.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Comma-separated exact origins, e.g. https://sabi.vercel.app
      - key: WEB_ORIGIN
        sync: false
      # First administrator, created only on an empty database. Password must be
      # at least 12 characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Pilot mode: serve translations that still need review, with a notice.
      # Set to "false" once the content is approved.
      - key: ALLOW_UNREVIEWED_TRANSLATIONS
        value: "true"
      # Providers. `mock` needs no key; set `openai` / `termii` and add the key
      # to switch. SMS_PROVIDER=mock in production sends nothing, so a real
      # Termii key is required before learners can sign in with a phone number.
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: SABI
      - key: NACE_API_KEY
        sync: false
    disk:
      name: sabi-data
      mountPath: /var/data
      sizeGB: 1
