# Render blueprint for the SABI API.
#
# This describes the free-plan service that is actually running today:
# https://sabi-api-zgz9.onrender.com (Frankfurt). A free instance has **no
# persistent disk**, so the JSON store sits on the instance filesystem and is
# wiped on every deploy or restart, and the instance sleeps after ~15 minutes
# idle (~50 s cold start). That is fine for a demo, not for a pilot.
#
# Before real learners, switch to the paid shape described at the bottom of this
# file: plan starter, a 1 GB disk at /var/data and
# DATABASE_FILE=/var/data/sabi.json.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository, or create
# the service through the API. Values marked `sync: false` are prompted for.

services:
  - type: web
    name: sabi-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Dev dependencies are required: Vite and TypeScript build the PWA. The API
    # itself runs through tsx, which is a runtime dependency.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Free plan: writable, but erased on every deploy and restart. The store
      # creates the directory if it is missing.
      - key: DATABASE_FILE
        value: /opt/render/project/src/apps/api/data/db.json
      # Generated once and kept by Render. Production refuses to start without
      # 32+ character values for all three.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Comma-separated exact origins. A relative web build sends same-origin
      # requests, but the API also serves that build, so its own URL is listed
      # too; the Vercel origin is required for the separately hosted frontend.
      - key: WEB_ORIGIN
        sync: false
      # First administrator, created only on an empty database. Password must be
      # at least 12 characters. On the free plan every deploy starts from an
      # empty store, so these take effect on the next deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Pilot mode: serve translations that still need review, with a notice.
      # Set to "false" once the content is approved.
      - key: ALLOW_UNREVIEWED_TRANSLATIONS
        value: "true"
      # Providers. `mock` needs no key; set `openai` / `termii` and add the key
      # to switch. SMS_PROVIDER=mock in production sends nothing, so a real
      # Termii key is required before learners can sign in with a phone number.
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: SABI
      - key: NACE_API_KEY
        sync: false
    # No `disk:` block: the free plan does not support persistent disks.
    #
    # Paid upgrade (requires a card at dashboard.render.com/billing):
    #   plan: starter
    #   DATABASE_FILE=/var/data/sabi.json
    #   disk:
    #     name: sabi-data
    #     mountPath: /var/data
    #     sizeGB: 1
